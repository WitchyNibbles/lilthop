name: Audit

# RustSec advisories are published after a release, so the lock file is checked
# every week as well as when it changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
  pull_request:
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: cargo install cargo-audit --locked

      - run: cargo audit
        working-directory: src-tauri
