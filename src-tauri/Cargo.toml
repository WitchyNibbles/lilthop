[package]
name = "lilthop"
version = "0.1.0"
description = "Private voice practice app: practise pitch, record and track your voice. Everything stays on your computer."
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["WitchyNibbles"]
repository = "https://github.com/WitchyNibbles/lilthop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lilthop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
hound = "3.5"
ringbuf = "0.4"
rodio = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Pitch analysis runs once per 21 ms of audio. Unoptimised, it needs 17 to 20 ms of that (measured
# on Linux), so a slower machine falls behind and the trace trails the voice. Only the crate
# itself is optimised (1 s of audio: 850 ms before, 40 ms after); the rest of `tauri dev` builds as before.
[profile.dev.package.lilthop]
opt-level = 2

[dev-dependencies]
tempfile = "3"
